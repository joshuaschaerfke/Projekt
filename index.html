<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einkaufslisten App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="header">
      <h1>Einkaufslisten App</h1>
      <p class="subtitle">Organisiere deinen Einkauf einfach und übersichtlich</p>
    </header>

    <main class="main-content">
      <section class="welcome-card">
        <h2>Willkommen</h2>
        <p>
          Plane deinen Einkauf schnell, behalte den Überblick über deine Listen
          und starte direkt mit deinem nächsten Einkauf.
        </p>

        <button class="main-button" type="button">
          <span class="icon">🛒</span>
          <span>Einkaufen starten</span>
        </button>
      </section>
    </main>

    <footer class="footer-buttons">
      <button class="nav-button" type="button" aria-label="Zu den erstellten Einkaufslisten">
        <span class="icon">📋</span>
        <span>Meine Listen</span>
      </button>

      <button class="nav-button" type="button" aria-label="Neue Einkaufsliste erstellen">
        <span class="icon">➕</span>
        <span>Neue Liste</span>
      </button>
    </footer>

  </div>
</body>
</html>
